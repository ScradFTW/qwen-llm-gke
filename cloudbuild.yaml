# Deploys on every push to main — see bradjobe-dev-infra's
# cloudbuild_triggers.tf (google_cloudbuild_trigger.app["qwen-llm-gke"]).
# Unlike the Cloud Run services, this ends in `kubectl apply`, not
# `gcloud run deploy` — the cluster/node pool are Terraform's job
# (bradjobe-dev-infra/gke.tf), the workload on top of them is this repo's.
steps:
  - id: validate
    # Runs scripts/test_validate_manifests.py (unit + fixture-driven tests
    # for scripts/validate_manifests.py's parsing/cross-referencing logic),
    # then the validator itself against this repo's actual k8s/ manifests
    # and cloudbuild.yaml wiring. A nonzero exit here fails the build
    # before anything gets built, pushed, or applied.
    name: python:3.12-slim
    entrypoint: sh
    args:
      - -c
      - |
        pip install --quiet --no-cache-dir --break-system-packages pyyaml
        python3 -m unittest discover -s scripts -p 'test_*.py' -v
        python3 scripts/validate_manifests.py

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - ${_DOCKERFILE}
      - -t
      - ${_ARTIFACT_REGISTRY}/qwen-llm:${SHORT_SHA}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_ARTIFACT_REGISTRY}/qwen-llm:${SHORT_SHA}

  - id: get-credentials
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    # HOME=/workspace on every gcloud/kubectl step below: Cloud Build steps
    # only share /workspace with each other, not each step's default $HOME,
    # and `gcloud container clusters get-credentials` writes the kubeconfig
    # kubectl needs to ~/.kube/config.
    env:
      - HOME=/workspace
    args:
      - container
      - clusters
      - get-credentials
      - ${_CLUSTER}
      - --zone=${_ZONE}

  - id: render-manifests
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args:
      - -c
      - |
        sed "s#IMAGE_PLACEHOLDER#${_ARTIFACT_REGISTRY}/qwen-llm:${SHORT_SHA}#" \
          ${_DEPLOYMENT_MANIFEST} > /workspace/deployment.rendered.yaml

  - id: apply
    # Not :slim — that variant doesn't bundle kubectl at all ("executable
    # file not found in $PATH"), confirmed by a real failed build.
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: kubectl
    args:
      - apply
      - -f
      - k8s/namespace.yaml
      - -f
      - k8s/backendconfig.yaml
      - -f
      - k8s/service.yaml
      - -f
      - /workspace/deployment.rendered.yaml
      - -f
      - k8s/managed-certificate.yaml
      - -f
      - k8s/ingress.yaml
    env:
      - HOME=/workspace

  - id: wait-for-rollout
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: kubectl
    args:
      - -n
      - llm
      - rollout
      - status
      - deployment/qwen-llm
      - --timeout=600s
    env:
      - HOME=/workspace

substitutions:
  # Must match bradjobe-dev-infra's var.zone — -c, not -a, since that's
  # the only zone in this region with T4 GPU capacity. Update both
  # together if it ever changes.
  _ZONE: northamerica-northeast1-c
  _CLUSTER: bradjobe-llm-cluster
  _ARTIFACT_REGISTRY: northamerica-northeast1-docker.pkg.dev/bradjobe-dev/apps
  # TEMPORARY: CPU fallback while GPU quota is pending (see
  # bradjobe-dev-infra's gke.tf llm_cpu pool). Once both GPU quotas are
  # approved and llm_gpu_pool is live, switch these two back to
  # `Dockerfile` and `k8s/deployment.yaml`.
  _DOCKERFILE: Dockerfile.cpu
  _DEPLOYMENT_MANIFEST: k8s/deployment-cpu.yaml

options:
  logging: CLOUD_LOGGING_ONLY
  # Compiling llama.cpp from source with nvcc is genuinely slow on the
  # default machine — a first attempt was still on the docker build step
  # after 26 minutes. A high-CPU machine cuts that materially.
  machineType: E2_HIGHCPU_8

timeout: 3600s

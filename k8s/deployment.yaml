apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-llm
  namespace: llm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qwen-llm
  template:
    metadata:
      labels:
        app: qwen-llm
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: llm-gpu-pool
      tolerations:
        # GKE auto-taints every Spot node this way — see
        # bradjobe-dev-infra's gke.tf.
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: llama-server
          image: IMAGE_PLACEHOLDER # replaced by cloudbuild.yaml's `sed` step
          ports:
            - containerPort: 8081
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
        - name: cors-proxy
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: cors-proxy-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: cors-proxy-conf
          configMap:
            name: cors-proxy-conf

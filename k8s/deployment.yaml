# Single container: no CORS sidecar (llama-server sends permissive CORS
# headers itself by default, confirmed in its own startup log) — an
# earlier version had an nginx sidecar for this, entirely unnecessary,
# and it created a probe-routing bug (health-checking the pod IP while
# the app bound to loopback) that this design doesn't have to begin with.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-llm
  namespace: llm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qwen-llm
  template:
    metadata:
      labels:
        app: qwen-llm
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: llm-gpu-pool
      tolerations:
        # GKE auto-taints every Spot node this way — see
        # bradjobe-dev-infra's gke.tf.
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: llama-server
          image: IMAGE_PLACEHOLDER # replaced by cloudbuild.yaml's `sed` step
          ports:
            - containerPort: 8080
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

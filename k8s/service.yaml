apiVersion: v1
kind: Service
metadata:
  name: qwen-llm
  namespace: llm
  annotations:
    # Standalone NEG with a fixed name: bradjobe-dev-infra's lb.tf uses it
    # as the llm.bradjobe.dev backend on the main load balancer, where the
    # health check and Cloud Armor rate limit are also configured.
    cloud.google.com/neg: '{"exposed_ports": {"80": {"name": "qwen-llm-neg"}}}'
spec:
  type: ClusterIP
  selector:
    app: qwen-llm
  ports:
    - port: 80
      targetPort: 8080

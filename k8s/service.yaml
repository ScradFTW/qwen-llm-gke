apiVersion: v1
kind: Service
metadata:
  name: qwen-llm
  namespace: llm
  annotations:
    # Attaches the Cloud Armor policy Terraform created (bradjobe-dev-infra's
    # cloud_armor.tf google_compute_security_policy.llm_rate_limit) and a
    # custom health check path, since GKE Ingress creates its own backend
    # service that Terraform never sees.
    cloud.google.com/backend-config: '{"default": "qwen-llm-backendconfig"}'
    # Standalone NEG with a fixed name, so bradjobe-dev-infra's main load
    # balancer (lb.tf) can reference it as a backend by name — llm.bradjobe.dev
    # is served there instead of by a separate GKE Ingress load balancer.
    cloud.google.com/neg: '{"exposed_ports": {"80": {"name": "qwen-llm-neg"}}}'
spec:
  type: ClusterIP
  selector:
    app: qwen-llm
  ports:
    - port: 80
      targetPort: 8080

# llm.bradjobe.dev is a different origin from bradjobe.dev (see
# demos-ui/packages/ai-tools/src/tabs/LlmTesting.jsx's API_URL), so the
# browser's fetch() needs real CORS headers — llama-server itself doesn't
# add any, hence this sidecar instead of touching llama.cpp.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cors-proxy-conf
  namespace: llm
data:
  default.conf: |
    server {
        listen 8080;

        location / {
            add_header Access-Control-Allow-Origin "https://bradjobe.dev" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "https://bradjobe.dev";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
            client_max_body_size 8k;
        }
    }
